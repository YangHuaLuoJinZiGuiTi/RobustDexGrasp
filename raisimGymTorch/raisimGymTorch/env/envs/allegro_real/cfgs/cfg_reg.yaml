seed: 1

environment:

  hardware:
    kinematic_type: "pinocchio"
    arm_type: "ur5"                
    hand_type: "allegro"
    real_world_mode: False          # add suffix "_real" or "_sim" for arm_type and hand_type
    flying_hand_mode: False
    save_state_mode: False
    rsc_model: "ur5_allegro"
    sim_model: "ur5_allegro_ori"        # simulation model in   rsc/${rsc_model}/${sim_model}.urdf
    vis_group_id: "0"                   # collision_id in raisim
    vis_mask_id:  "0,1,2,63"            # collision_mask_id in raisim, 2 is table, 63 is all
 
    log_real:
      save_state_path: "/home/ubuntu/hand/github/vision_dex/raisimGymTorch/raisimGymTorch/env/hardware/log_data/csv/joint.csv"
      record_video: False
      mp4_record_path: "/home/ubuntu/hand/github/vision_dex/raisimGymTorch/raisimGymTorch/env/hardware/log_data/mp4/log.mp4"

    pointcloud_real:
      camera_K_path: "/home/ubuntu/hand/calculate/0_datasets_allegro_hand_topview"
      sample_pointcloud_mode: 'manual' # 'auto' or 'manual' or 'foundationpose' or 'mesh'
      obj_mesh: 'dummy' # 'random' or 'real/loopy_head_side' or '035_power_drill' or  'dummy'

    kinematic_real:
      fk_model: "ur5_allegro_fk"          # FK model in           rsc/${rsc_model}/${fk_model}.urdf
      ik_model: "ur5"                     # IK model in           rsc/${rsc_model}/${ik_model}.urdf
                                          # IK collision model in rsc/${rsc_model}/${ik_model}.srdf
      real_velocity_dt_s: 0.1
  
    arm_real:
      ip: "192.168.56.101"
      freq_hz: 200.0
      move_vel: 1.0
      move_acc: 1.0
      servoJ_ahead_time: 0.05 # range [0.03,0.2] smoothens the trajectory with this lookahead time 0.18 for sysID
      servoJ_gain: 1600 # for following target position, range [100,2000] 400 for sysID
      real_velocity_dt_s: 0.1

    hand_real:
      freq_hz: 200.0

  grasp_steps: 160

  render: True
  eval_every_n: 500
  update_every_n: 20
  num_threads: 32
  simulation_dt: 0.005
  control_dt: 0.05
  max_time: 4.0
  root_guided: True
  visualize: False
  unseen: True
  new_category: False
  load_set: "mixed_train"
#  hand_model_r: "allegro.urdf"
#  hand_model_r: "ur5_allegro.urdf"
  hand_model_r: "ur5_allegro_ori.urdf"
  finger_action_std: 0.015
  rot_action_std: 0.01
  reward:
    affordance_reward:
      coeff: 0.5
#    not_affordance_reward:
#      coeff: -0.0
    affordance_contact_reward:
      coeff: 1.5
#    not_affordance_contact_reward:
#      coeff: -0.0
    affordance_impulse_reward:
      coeff: 0.5
#    not_affordance_impulse_reward:
#      coeff: -0.0


    table_reward:
      coeff: -0.01
    table_contact_reward:
      coeff: -1.0
    table_impulse_reward:
      coeff: -0.5

    arm_height_reward:
#      coeff: -0.03
      coeff: -0.02
    arm_contact_reward:
#      coeff: -3.0
      coeff: -0.1
    arm_impulse_reward:
#      coeff: -1.0
      coeff: -0.1

    direction_reward:
      coeff: -0.1
    center_reward:
      coeff: -1.0
    obj_displacement_reward:
      coeff: -1.0


    wrist_vel_reward_:
      coeff: -1.0
    #      coeff: -0.0
    wrist_qvel_reward_:
      coeff: -0.1
    #      coeff: -0.0

    obj_vel_reward_:
      coeff: -1.5
    obj_qvel_reward_:
      coeff: -0.01

    arm_joint_vel_reward_:
      coeff: -1.0



    anatomy_reward:
      coeff: -0.0
    torque:
      coeff: -0.0

architecture:
  policy_net: [128, 128]
  value_net: [128, 128]