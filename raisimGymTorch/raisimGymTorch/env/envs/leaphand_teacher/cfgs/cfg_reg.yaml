seed: 1

environment:

  hardware:
    kinematic_type: "pinocchio"
    arm_type: "ur5"                
    hand_type: "leap"
    real_world_mode: False          # add suffix "_real" or "_sim" for arm_type and hand_type
    flying_hand_mode: False

    rsc_model: "ur5_leaphand"
    sim_model: "ur5_leap"        # simulation model in   rsc/${rsc_model}/${sim_model}.urdf
    fk_model: "ur5_leap_fk"          # FK model in           rsc/${rsc_model}/${fk_model}.urdf
    ik_model: "ur5"                     # IK model in           rsc/${rsc_model}/${ik_model}.urdf
                                        # IK collision model in rsc/${rsc_model}/${ik_model}.srdf
    vis_group_id: "0"                   # collision_id in raisim
    vis_mask_id:  "0,1,2,63"            # collision_mask_id in raisim, 2 is table, 63 is all

    real_velocity_dt_s: 0.1
  
    arm_real:
      ip: "192.168.56.101"
      freq_hz: 500.0
      move_vel: 0.5
      move_acc: 0.3

    hand_real:
      freq_hz: 500.0
  render: True
  eval_every_n: 500
  update_every_n: 20
  num_threads: 32
  simulation_dt: 0.0025
  control_dt: 0.01
  max_time: 4.0
  root_guided: True
  visualize: False
  unseen: True
  new_category: False
  load_set: "mixed_train"
#  hand_model_r: "allegro.urdf"
#  hand_model_r: "ur5_allegro.urdf"
  hand_model_r: "ur5_leap.urdf"
  finger_action_std: 0.015
  rot_action_std: 0.01
  reward:
    affordance_reward:
      coeff: 0.5
#    not_affordance_reward:
#      coeff: -0.0
    affordance_contact_reward:
      coeff: 1.5
#    not_affordance_contact_reward:
#      coeff: -0.0
    affordance_impulse_reward:
      coeff: 0.5
#    not_affordance_impulse_reward:
#      coeff: -0.0


    table_reward:
      coeff: -0.01
    table_contact_reward:
      coeff: -1.0
    table_impulse_reward:
      coeff: -0.5

    arm_height_reward:
#      coeff: -0.03
      coeff: -0.02
    arm_contact_reward:
#      coeff: -3.0
      coeff: -0.1
    arm_impulse_reward:
#      coeff: -1.0
      coeff: -0.1

    direction_reward:
      coeff: -0.1
    center_reward:
      coeff: -1.0
    obj_displacement_reward:
      coeff: -1.0


    wrist_vel_reward_:
      coeff: -0.001
    #      coeff: -0.0
    wrist_qvel_reward_:
      coeff: -0.0001
    #      coeff: -0.0

    obj_vel_reward_:
      coeff: -1.5
    obj_qvel_reward_:
      coeff: -0.01




    anatomy_reward:
      coeff: -0.0
    torque:
      coeff: -0.0

architecture:
  policy_net: [128, 128]
  value_net: [128, 128]