seed: 1

environment:

  hardware:
    kinematic_type: "pinocchio"
    arm_type: "ur5"                
    hand_type: "allegro"
    real_world_mode: True          # add suffix "_real" or "_sim" for arm_type and hand_type
    flying_hand_mode: False
    save_state_mode: True
    save_state_path: "/home/ubuntu/hand/github/vision_dex/raisimGymTorch/raisimGymTorch/env/hardware/joint.csv"
    camera_K_path: "/home/ubuntu/hand/calculate/0_datasets_allegro_hand_topview"
    rsc_model: "ur5_allegro"
    sim_model: "ur5_allegro_ori"        # simulation model in   rsc/${rsc_model}/${sim_model}.urdf
    fk_model: "ur5_allegro_fk"          # FK model in           rsc/${rsc_model}/${fk_model}.urdf
    ik_model: "ur5"                     # IK model in           rsc/${rsc_model}/${ik_model}.urdf
                                        # IK collision model in rsc/${rsc_model}/${ik_model}.srdf
    vis_group_id: "0"                   # collision_id in raisim
    vis_mask_id:  "0,1,2,63"            # collision_mask_id in raisim, 2 is table, 63 is all

    real_velocity_dt_s: 0.1
  
    arm_real:
      ip: "192.168.56.101"
      freq_hz: 500.0
      move_vel: 1.0
      move_acc: 1.0
      servoJ_ahead_time: 0.08 # range [0.03,0.2] smoothens the trajectory with this lookahead time
      servoJ_gain: 2000 # for following target position, range [100,2000]

    hand_real:
      freq_hz: 200.0

  render: True
  eval_every_n: 500
  update_every_n: 20
  num_threads: 32
  simulation_dt: 0.005
  control_dt: 0.05
  max_time: 4.0
  root_guided: True
  visualize: False
  unseen: True
  new_category: False
  load_set: "mixed_train"
#  hand_model_r: "allegro.urdf"
#  hand_model_r: "ur5_allegro.urdf"
  hand_model_r: "ur5_allegro_ori.urdf"
  finger_action_std: 0.015
  rot_action_std: 0.005
  reward:
    affordance_reward:
      coeff: 0.5
#    not_affordance_reward:
#      coeff: -0.0
    affordance_contact_reward:
      coeff: 1.5
#    not_affordance_contact_reward:
#      coeff: -0.0
    affordance_impulse_reward:
      coeff: 0.5
#    not_affordance_impulse_reward:
#      coeff: -0.0


    table_reward:
      coeff: -0.01
    table_contact_reward:
      coeff: -1.0
    table_impulse_reward:
      coeff: -0.5

    arm_height_reward:
#      coeff: -0.03
      coeff: -0.02
    arm_contact_reward:
#      coeff: -3.0
      coeff: -0.1
    arm_impulse_reward:
#      coeff: -1.0
      coeff: -0.1

    direction_reward:
      coeff: -0.1
    center_reward:
      coeff: -1.0


    wrist_vel_reward_:
      coeff: -1.0
    #      coeff: -0.0
    wrist_qvel_reward_:
      coeff: -0.1
    #      coeff: -0.0

    obj_vel_reward_:
#      coeff: -1.5
      coeff: -15.0
    obj_qvel_reward_:
#      coeff: -0.01
      coeff: -0.2
    obj_displacement_reward:
#      coeff: -1.0
      coeff: -5.0

    arm_joint_vel_reward_:
      coeff: -1.0



    anatomy_reward:
      coeff: -0.0
    torque:
      coeff: -0.0

architecture:
  policy_net: [128, 128]
  value_net: [128, 128]