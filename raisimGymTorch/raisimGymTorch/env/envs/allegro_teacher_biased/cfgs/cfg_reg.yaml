seed: 1

environment:

  hardware:
    kinematic_type: "simfk"
    arm_type: "ur5"                
    hand_type: "allegro"
    real_world_mode: False          # add suffix "_real" or "_sim" for arm_type and hand_type
    flying_hand_mode: False
    save_state_mode: False
    rsc_model: "ur5_allegro"
    sim_model: "ur5_allegro_low_effort_mass"        # simulation model in   rsc/${rsc_model}/${sim_model}.urdf
#    sim_model: "ur5_allegro_low_effort"        # simulation model in   rsc/${rsc_model}/${sim_model}.urdf
#    sim_model: "ur5_allegro_ori"        # simulation model in   rsc/${rsc_model}/${sim_model}.urdf
    vis_group_id: "0"                   # collision_id in raisim
    vis_mask_id:  "0,1,2,63"            # collision_mask_id in raisim, 2 is table, 63 is all
#    arm_pd_file: "UR5Identification.txt" # path in ./raisimGymTorch/env/hardware/arm/UR5Identification.txt
    arm_pd_file: "UR5Identification_id5hz.txt" # path in ./raisimGymTorch/env/hardware/arm/UR5Identification.txt
#    hand_pd_file: "AllegroIdentification.txt" # path in ./raisimGymTorch/env/hardware/hand/AllegroIdentification.txt
#    hand_pd_file: "AllegroIdentification_id5hz.txt" # path in ./raisimGymTorch/env/hardware/hand/AllegroIdentification.txt
    hand_pd_file: "AllegroIdentification_id5hz_small_p.txt" # path in ./raisimGymTorch/env/hardware/hand/AllegroIdentification.txt
#    hand_pd_file: "AllegroIdentification_hardware_pd.txt" # path in ./raisimGymTorch/env/hardware/hand/AllegroIdentification.txt
    init_finger_pose: [0.3, 0.6, 0.3, 0.5, 0.3, 0.6, 0.3, 0.5, 0.3, 0.6, 0.3, 0.5, 1.3, 0.0, -0.1, 0.2]
#    randomize_friction: "0.5,0.6,0.7,0.8,0.9"
    table_friction: 0.2

#  partial_pt_init_pose: True
  biased: False
  grasp_steps: 160
  train_safe: True
  top: False
#  camera_position: [0.25, -0.55152, 1.5]
  camera_position: [0.04, -0.59, 1.4]

  render: True
  eval_every_n: 500
  update_every_n: 20
  num_threads: 32
  simulation_dt: 0.005
  control_dt: 0.05
  max_time: 4.0
  root_guided: True
  visualize: False
  unseen: True
  new_category: False
  load_set: "mixed_train"
  finger_action_std: 0.015
  rot_action_std: 0.005
  reward:
    affordance_reward:
      coeff: 0.5
    affordance_contact_reward:
      coeff: 1.5
    affordance_impulse_reward:
      coeff: 2.0


    table_reward:
      coeff: -0.03
#      coeff: -0.01
    table_contact_reward:
      coeff: -1.0
#      coeff: -2.0
    table_impulse_reward:
      coeff: -0.5
#      coeff: -2.0

    arm_height_reward:
#      coeff: -0.03
      coeff: -0.05
    arm_contact_reward:
#      coeff: -3.0
      coeff: -0.1
    arm_impulse_reward:
#      coeff: -1.0
      coeff: -0.1

    direction_reward:
#      coeff: -0.1
      coeff: -0.0
    center_reward:
#      coeff: -1.0
      coeff: -0.0

    wrist_vel_reward_:
      coeff: -1.0
    #      coeff: -0.0
    wrist_qvel_reward_:
      coeff: -0.1
    #      coeff: -0.0

    obj_vel_reward_:
#      coeff: -1.5
      coeff: -15.0
    obj_qvel_reward_:
#      coeff: -0.01
      coeff: -0.2
    obj_displacement_reward:
#      coeff: -1.0
      coeff: -5.0

    arm_joint_vel_reward_:
      coeff: -1.0


    arm_action_reward:
      coeff: -0.0
#      coeff: -0.5

    hand_action_reward:
      coeff: -0.0
#      coeff: -0.25

    anatomy_reward:
      coeff: -0.0
    torque:
      coeff: -0.0

architecture:
  policy_net: [128, 128]
  value_net: [128, 128]